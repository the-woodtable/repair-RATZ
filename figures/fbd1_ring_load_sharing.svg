<circle cx="250" cy="110" r="20" fill="none" stroke="#888" stroke-width="1.8"/>
<circle cx="362.6" cy="175" r="20" fill="none" stroke="#888" stroke-width="1.8"/>
<circle cx="362.6" cy="305" r="20" fill="none" stroke="#888" stroke-width="1.8"/>
<circle cx="250" cy="370" r="20" fill="none" stroke="#888" stroke-width="1.8"/>
<circle cx="137.4" cy="305" r="20" fill="none" stroke="#888" stroke-width="1.8"/>
<circle cx="137.4" cy="175" r="20" fill="none" stroke="#888" stroke-width="1.8"/>

<circle cx="250" cy="240" r="30" fill="none" stroke="#888" stroke-width="1.8"/>

<path d="M 195 185 A 78 78 0 0 1 305 185" fill="none" stroke="#5B4BC4" stroke-width="2.2" marker-end="url(#aP)"/>
<text x="250" y="156" font-size="14" font-weight="bold" fill="#5B4BC4" text-anchor="middle">&#964; carrier</text>

