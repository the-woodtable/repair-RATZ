<text x="262" y="292" font-size="14" font-weight="bold" fill="#444">m d g</text>

<circle cx="250" cy="90" r="4" fill="#1D8F6C"/>
<text x="250" y="76" font-size="13" fill="#1D8F6C" text-anchor="middle">N &#8776; 0</text>

<line x1="392.9" y1="157.5" x2="379.9" y2="165" stroke="#1D8F6C" stroke-width="2.5" marker-end="url(#aG)"/>
<line x1="418.9" y1="337.5" x2="379.9" y2="315" stroke="#1D8F6C" stroke-width="2.5" marker-end="url(#aG)"/>
<line x1="250" y1="450" x2="250" y2="390" stroke="#1D8F6C" stroke-width="2.5" marker-end="url(#aG)"/>
<line x1="81.1" y1="337.5" x2="120.1" y2="315" stroke="#1D8F6C" stroke-width="2.5" marker-end="url(#aG)"/>
<line x1="107.1" y1="157.5" x2="120.1" y2="165" stroke="#1D8F6C" stroke-width="2.5" marker-end="url(#aG)"/>

<text x="250" y="470" font-size="13" font-weight="bold" fill="#1D8F6C" text-anchor="middle">N i</text>

<text x="452" y="120" font-size="13" font-weight="bold" fill="#333">Normal force at each contact</text>
<text x="452" y="146" font-size="13" fill="#333">&#966; = 0&#176; (top)</text><text x="640" y="146" font-size="13" fill="#1D8F6C" text-anchor="end">0.00 N</text>
<text x="452" y="171" font-size="13" fill="#333">&#966; = 60&#176;</text><text x="640" y="171" font-size="13" fill="#1D8F6C" text-anchor="end">0.98 N</text>
<text x="452" y="196" font-size="13" fill="#333">&#966; = 120&#176;</text><text x="640" y="196" font-size="13" fill="#1D8F6C" text-anchor="end">2.94 N</text>
<text x="452" y="221" font-size="13" fill="#333">&#966; = 180&#176; (bottom)</text><text x="640" y="221" font-size="13" fill="#1D8F6C" text-anchor="end">3.92 N</text>
<text x="452" y="246" font-size="13" fill="#333">&#966; = 240&#176;</text><text x="640" y="246" font-size="13" fill="#1D8F6C" text-anchor="end">2.94 N</text>
<text x="452" y="271" font-size="13" fill="#333">&#966; = 300&#176;</text><text x="640" y="271" font-size="13" fill="#1D8F6C" text-anchor="end">0.98 N</text>
<line x1="452" y1="286" x2="640" y2="286" stroke="#bbb" stroke-width="1"/>
<text x="452" y="306" font-size="13" font-weight="bold" fill="#333">&#931; N i</text><text x="640" y="306" font-size="13" font-weight="bold" fill="#1D8F6C" text-anchor="end">11.76 N</text>

<line x1="40" y1="495" x2="640" y2="495" stroke="#bbb" stroke-width="1"/>
<text x="40" y="520" font-size="15" font-weight="bold" fill="#333">N i  =  N pre  &#8722;  ( 2 m d g / n ) cos &#966; i</text>
<text x="40" y="544" font-size="13" fill="#555">Gravity redistributes normal force around the ring; the total &#931;N i = n N pre is unchanged.</text>
<text x="40" y="565" font-size="13" fill="#555">Top wheel is the critical contact &#8212; retaining it requires N pre &gt; 2 m d g / n.</text>
</svg>
