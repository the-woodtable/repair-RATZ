<text x="298" y="246" font-size="14" fill="#333">F a = F R cos &#946;</text>
<text x="344" y="278" font-size="13" fill="#555">F c = F R sin &#946;</text>
<text x="344" y="308" font-size="15" font-weight="bold" fill="#5B4BC4">F R</text>

<line x1="40" y1="420" x2="640" y2="420" stroke="#bbb" stroke-width="1"/>
<text x="40" y="444" font-size="15" font-weight="bold" fill="#333">F R  &#8804;  &#956; N i          F a  =  F R cos &#946;          F a, max  =  &#956; cos &#946; &#183; &#931;N i</text>
<text x="40" y="468" font-size="13" fill="#555">View: pipe inner wall unrolled flat, seen from inside the pipe. N acts radially, out of the page.</text>
<text x="40" y="489" font-size="13" fill="#555">Forward motion is generated by lateral constraint, not by forward rolling.</text>
