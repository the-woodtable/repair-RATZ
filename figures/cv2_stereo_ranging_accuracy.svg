<text x="82" y="60" font-size="12" fill="#555" text-anchor="end">50</text>
<text x="90" y="399" font-size="12" fill="#555" text-anchor="middle">0</text>
<text x="207" y="399" font-size="12" fill="#555" text-anchor="middle">250</text>
