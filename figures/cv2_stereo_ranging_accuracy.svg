<polyline points="90,380 137,376 184,368 231,354 278,336 325,312 372,283 419,249 466,209 513,164 560,108" fill="none" stroke="#5B4BC4" stroke-width="2.8"/>
<text x="480" y="230" font-size="13" font-weight="bold" fill="#5B4BC4" text-anchor="end">&#916;Z = Z&#178; &#916;d / ( fx B )</text>

<line x1="133" y1="60" x2="133" y2="380" stroke="#A32D2D" stroke-width="2" stroke-dasharray="6 4"/>
<text x="126" y="100" font-size="12" font-weight="bold" fill="#791F1F" text-anchor="end">no stereo</text>
<text x="126" y="118" font-size="12" fill="#791F1F" text-anchor="end">Z &lt; 150 mm</text>

<line x1="248" y1="349" x2="248" y2="380" stroke="#3B6D11" stroke-width="1.6" stroke-dasharray="4 3"/>
