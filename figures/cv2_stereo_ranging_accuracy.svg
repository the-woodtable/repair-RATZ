<text x="258" y="354" font-size="12" fill="#3B6D11">full-coverage working distance</text>

<text x="40" y="442" font-size="12" fill="#666">&#916;d = 1.63 px (calibration RMS)    fx B = 38 385 mm&#183;px    Z near = fx B / 256 = 150 mm</text>
